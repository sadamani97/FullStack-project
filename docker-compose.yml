version: "3.8"

services:

  mysql:
    image: mysql:8
    container_name: fullstack_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fullstackdb
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: fullstack_backend
    restart: on-failure
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: fullstackdb
      JWT_SECRET: 91519c...
      NODE_ENV: production
      PORT: 5000

  frontend:
    build: ./frontend
    container_name: fullstack_frontend
    restart: on-failure
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data: