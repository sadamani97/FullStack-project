server {
    listen 80;
    server_name localhost;

    # Root directory where Vite build output is copied
    root /usr/share/nginx/html;
    index index.html;

    # ── React Router support ──────────────────────────────────────────
    # Without this, refreshing any route (e.g. /dashboard) returns 404.
    # try_files checks: actual file → actual folder → fallback index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API proxy ─────────────────────────────────────────────────────
    # Forwards /api/* requests to the backend container.
    # "backend" resolves via Docker Compose network / K8s Service name.
    location /api/ {
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;

        # Pass real client info to backend
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket support (keep-alive upgrade)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }

    # ── Static asset caching ──────────────────────────────────────────
    # Tell browsers to cache JS/CSS/images aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Gzip compression ─────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
}